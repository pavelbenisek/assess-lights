[project]
name = "assess-lights"
version = "0.6.0"
description = "Assess a directory of night-sky FITS light frames and mark the bad ones for removal"
authors = [
    { name = "Pavel Benisek", email = "pavel@benisek.eu" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "astropy>=6.0",
    "scikit-image>=0.22",
    "rich>=13.0",
    "sep>=1.4",
]

[project.scripts]
assess-lights = "assess_lights.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assess_lights"]
